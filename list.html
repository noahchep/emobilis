<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!-- unordered list -->
     <ul>
        <li>London</li>
        <li>Nairobi</li>
        <li>Paris</li>
        <li>Tokyo</li>
        <li>Illinois</li>
     </ul>
     
     <p>Bellow is an ordered Lists</p>

     <ol>
        <li>London</li>
        <li>Nairobi</li>
        <li>Tokyo</li>
        <li>Paris</li>
     </ol>
</body>
</html>
